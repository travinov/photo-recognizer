<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Photo Recognizer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <header class="hero">
        <div class="hero__content">
            <a href="{{ url_for('home') }}" class="brand">Photo Recognizer</a>
            <p class="hero__text">
                Каталог событий, поиск людей по фотографиям и сборка галереи по подтверждённому человеку.
            </p>
        </div>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
